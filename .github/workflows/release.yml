name: Release

# A tag that is the version (`npm version 0.2.0` makes `0.2.0`; no `v`) builds the plugin, attests the release files
# and drafts a GitHub release with them (ADR-0004 §4). Review the draft and publish it.
#
# The release is the artifact WebTiles' automated admission reads (webtiles#253, ADR-0004 §4): it downloads these
# assets on the server, checks the attestation (built by this repository's workflow at this tag), and copies them to
# webtiles.eu. Browsers never fetch from GitHub: release assets send no CORS headers.
#
# Untested until this repository's first tag: check the first run's log and the draft.
# Attestations need a public repository (or GitHub Enterprise Cloud for a private one).
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # the draft release
      packages: read # @webtiles-viewer/plugin-api from GitHub Packages, until webtiles#261
      id-token: write # the attestation's signing identity
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@webtiles-viewer'
      - name: Install
        run: npm install
        env:
          # See ci.yml.
          NODE_AUTH_TOKEN: ${{ secrets.WEBTILES_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Tag matches the version
        run: |
          manifest="$(node -p 'require("./manifest.json").version')"
          package="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$manifest" ] || [ "$GITHUB_REF_NAME" != "$package" ]; then
            echo "::error::tag $GITHUB_REF_NAME, manifest.json $manifest and package.json $package must be equal (use npm version)"
            exit 1
          fi
      # The same steps as CI: lint, typecheck, test, build, bundle contract.
      - name: Check and build
        run: npm run check
      - name: Attest
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A prerelease (0.2.0-beta.1) is marked as one; WebTiles never makes it `current` (ADR-0004 §4.5).
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes \
            "${prerelease[@]}" dist/main.js dist/manifest.json dist/styles.css
